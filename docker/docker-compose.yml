services:
  apexcrawler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - cloakbrowser_cache:/root/.cloakbrowser
      - apexcrawler_data:/root/.apexcrawler
    environment:
      - APEX_LOG_LEVEL=INFO
    shm_size: 2gb
    restart: unless-stopped

volumes:
  cloakbrowser_cache:
  apexcrawler_data:
